events {
    worker_connections 1024; # Maximum number of connections per process
}

http {
    # Rate limit: 10 requests/s per client IP, state kept in 10 MB of shared memory
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=10r/s;

    # A/B test: requests with "X-Experiment-Group: debug" go to api-v2, everything else to api-v1
    map $http_x_experiment_group $api_backend {
        default api-v1;
        debug   api-v2;
    }

    # api-v1: standard API, 3 replicas behind the service name (Round Robin)
    upstream api-v1 {
        # Define API instances by their Docker Compose service name and internal port
        server api-v1:8000;
        # Optional -> Specify a strategy (default: Round Robin)
        # least_conn; # For the Least Connections strategy
        # ip_hash; # For the IP Hash strategy
    }

    # api-v2: debug API, 1 instance
    upstream api-v2 {
        # Define API instances by their Docker Compose service name and internal port
        server api-v2:8000;
    }

    # HTTP server: redirects to HTTPS
    server {
        listen 80;
        server_name localhost; # Domain name or IP that this server block manages

        # Redirect all HTTP requests to HTTPS
        return 301 https://$host$request_uri;
    }

    # HTTPS server: TLS, authentication, rate limit, routing
    server {
        listen 443 ssl; # Listen on port 443 and enable TLS
        server_name localhost; # Domain name or IP that this server block manages

        # Paths to TLS certificates
        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        # TLS protocols and ciphers
        ssl_protocols TLSv1.2 TLSv1.3; # Only allow modern versions of TLS
        ssl_ciphers HIGH:!aNULL:!MD5; # List of allowed cipher suites
        ssl_prefer_server_ciphers on; # Prefer server ciphers

        # All requests that start with /predict will be handled here
        location /predict {
            # Basic authentication
            auth_basic "API Access Protected"; # Message displayed to the user
            auth_basic_user_file /etc/nginx/.htpasswd; # Path to the .htpasswd file in the container

            # Rate limit: up to 5 requests above the rate pass without delay, further ones are rejected
            limit_req zone=apilimit burst=5 nodelay;
            limit_req_status 429; # Rejected requests get 429 Too Many Requests (default: 503)

            # proxy_pass: forwards the request to the upstream group $api_backend
            proxy_pass http://$api_backend;

            # Address of the API container that responds to the request (load balancing test)
            add_header X-Upstream-Addr $upstream_addr always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Internal server for monitoring: port is not published, so only containers can reach it
    server {
        listen 8080;

        location /nginx_status {
            stub_status on; # Activate the stub_status module
            access_log off; # Do not log access to this endpoint
            allow 127.0.0.1; # Allow access from inside the Nginx container
            allow 10.123.0.0/24; # Allow access from the Docker network (Nginx exporter)
            deny all; # Block all other access
        }
    }
}
